<div class="location-panel__content">
  <p>一幢气息奄奄的宅邸盘踞在生锈的铁栅栏后方。铁门被扭曲撕裂。右半边门被丢在一边，左半边门如秋千一般地懒洋洋地随风摇晃，断断续续地发出吱嘎声和铿锵声。杂草挤满了地面并向着房屋压去。不过墙边的杂草被踩踏出了一条路。曾经美丽的墙面上留下了深深的爪痕，大片大片的焦黑诉说这房子曾被火围困。窗玻璃一块不剩，甚至连碎片也没有了。每扇窗户都用木板死死封住，每一块木板上都有邪恶留下的痕迹。</p>
  <p>你们在这里遇到了伊莲娜，镇长的女儿，以及老镇长躺在棺木里的尸体。伊莲娜和伊斯马克请求你们，在离开这个村子前，帮助他们把老镇长安葬。</p>
</div>
