<div class="location-panel__content">
  <p>紧挨着鸦阁城堡的基柱山脚，有一个坡度平缓的高地，其上摇摇欲坠地立着一幢高大的建筑。这座木石结构的教堂在邪恶的侵袭中撑过了好几个世纪，已经又破又旧，像一位疲倦的老者。</p>
  <p>教堂的背后站着一座钟塔，木瓦房顶的破洞里隐约有光渗出。屋顶的椽子已不堪重负，似乎随时会塌。</p>
  <p>这座沉重的教堂木门上满是爪印和火烧留下的焦痕。</p>
</div>
