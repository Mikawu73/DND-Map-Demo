    <p>巴洛维亚村唯一的主教，信仰晨曦之主。当你们第一次见到他的时候，他似乎已经有点儿精神失常，跪坐在礼拜堂中嘴里不断地重复祈祷。幸运的是，在听到伊莲娜和伊斯马克的请求之后，他仍然记得自己身为主教的职责，担任起了老镇长葬礼的牧师。</p>
    <p>在他的言语中，你们了解到巴洛维亚村每天半夜十二点的“亡者行军”现象。这些曾向施特拉德掀起反旗的冒险者们被吸血鬼诅咒永远无法安眠，每天午夜都将被再次唤醒，别无选择地飘往鸦阁城堡。主教的儿子似乎也卷入了这场悲剧...?</p>
